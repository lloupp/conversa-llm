[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conversa-llm"
version = "0.1.0"
description = "LLM conversacional pequeno, treinado do zero para fins de estudo e evolução incremental."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
web = [
  "ddgs>=9.16.0,<10",
]

[project.scripts]
conversa-pi-server = "conversa_llm.openai_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
